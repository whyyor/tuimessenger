# Bridge fixes (WhatsApp, Meta, Telegram, Slack changes) reach users only when these pins move,
# so Dependabot opens a PR when they do; CI builds and tests it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    # Updates land on dev (staging) like every change, and reach main with the next release.
    target-branch: dev
    schedule:
      # Monthly while the repo is private (each PR costs CI minutes); weekly again once it's public.
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      bridges:
        patterns:
          - "maunium.net/go/mautrix"
          - "go.mau.fi/mautrix-*"
          - "go.mau.fi/whatsmeow"
          - "go.mau.fi/util"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "maunium.net/go/mautrix"
          - "go.mau.fi/mautrix-*"
          - "go.mau.fi/whatsmeow"
          - "go.mau.fi/util"
    ignore:
      # The terminal library is pinned on purpose (newer versions change rendering); move it only deliberately.
      - dependency-name: "github.com/gdamore/tcell/v2"
      - dependency-name: "github.com/gdamore/tcell/v3"
      # cbind 0.1.7+ is built on tcell v3.
      - dependency-name: "codeberg.org/tslocum/cbind"
      # Character widths decide where every cell is drawn; it moves with tcell (0.0.31 shifts Devanagari marks).
      - dependency-name: "github.com/mattn/go-runewidth"
  - package-ecosystem: github-actions
    directory: /
    # Updates land on dev (staging) like every change, and reach main with the next release.
    target-branch: dev
    schedule:
      interval: monthly
