name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal assets)
          if [ -n "$unformatted" ]; then echo "Not gofmt-ed:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: make vet
      - name: test
        run: make test
      - name: build
        run: make build && ./tuimessenger version

  privacy:
    # Secrets and personal data (phone numbers, chat-network IDs, home paths…) in every commit of the checked-out
    # history (HEAD: the PR and main), with that history's own rules in .gitleaks.toml. Not --all: other branches
    # fetched alongside would be judged by this PR's rules (other PRs' allowlists aren't here yet).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1 --log-opts=HEAD
