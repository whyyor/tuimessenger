name: Nix

# The flake pins a hash of every Go dependency (vendorHash), so any go.mod/go.sum change (e.g. a Dependabot bump)
# breaks `nix run github:whyyor/tuimessenger` until it's updated. Build it whenever those files change.
on:
  pull_request:
    paths: [go.mod, go.sum, flake.nix, flake.lock, VERSION, .github/workflows/nix.yml]
  push:
    branches: [main, dev]
    paths: [go.mod, go.sum, flake.nix, flake.lock, VERSION, .github/workflows/nix.yml]

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: |
          if ! nix build .#tuimessenger --print-build-logs 2> build.log; then
            got=$(sed -n 's/.*got: *\(sha256-[^ ]*\).*/\1/p' build.log | head -1)
            if [ -n "$got" ]; then
              echo "::error file=flake.nix::vendorHash is stale; set it to $got (or run scripts/update-vendor-hash.sh)"
            else
              tail -40 build.log
            fi
            exit 1
          fi
          ./result/bin/tuimessenger version
          ./result/bin/tuimessenger version | grep -q "^tuimessenger v$(cat VERSION)+"
